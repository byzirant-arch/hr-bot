<style>
:root {
  --bg: #edf0f2; --panel: #fafbfb; --ink: #15202a; --muted: #566877; --line: #d3dade;
  --accent: #0e5c70; --over: #b3261e; color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f171d; --panel: #16212a; --ink: #e5ecf0; --muted: #92a3af; --line: #29383f; --accent: #5fc0d6; --over: #ff8b82; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 20px;
  font: 15px/1.5 Bahnschrift, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
}
main { width: 100%; max-width: 380px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 30px 28px 26px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.logo { display: block; margin: 0 auto 18px; width: 150px; height: auto; border-radius: 8px; }
@media (prefers-color-scheme: dark) { .logo { background: #fff; padding: 8px 10px; } }
h1 { font-size: 20px; line-height: 1.2; margin: 0 0 4px; text-align: center; font-weight: 600; letter-spacing: .01em; }
.sub { color: var(--muted); text-align: center; margin: 0 0 22px; font-size: 14px; }
label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 5px; }
input {
  width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  width: 100%; margin-top: 22px; font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
  padding: 11px 14px; background: var(--accent); color: var(--panel);
}
button:disabled { opacity: .6; cursor: default; }
.error { min-height: 22px; margin: 14px 0 0; color: var(--over); font-size: 14px; text-align: center; }
.note { margin: 6px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
</style>

    <h1>Панель обработки заявок</h1>
    <p class="sub">Войдите, чтобы продолжить</p>
    <label for="user">Логин</label>
    <input id="user" name="username" autocomplete="username" required autofocus>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="go">Войти</button>
    <p class="error" id="error" role="alert"></p>
    <p class="note" id="note">Сеанс действует 8 часов, потом потребуется войти снова.</p>
  </form>
</main>
<script>
"use strict";
const form = document.getElementById("form"), err = document.getElementById("error"), go = document.getElementById("go");
if (new URLSearchParams(location.search).has("expired")) err.textContent = "Сеанс закончился. Войдите снова.";
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = ""; go.disabled = true; go.textContent = "Проверяю…";
  try {
    const r = await fetch("/login", {
      method: "POST", credentials: "same-origin", cache: "no-store",
      headers: { "Content-Type": "application/json", "X-Dashboard": "1" },
      body: JSON.stringify({ user: document.getElementById("user").value, password: document.getElementById("password").value }),
    });
    if (r.ok) { location.href = "/"; return; }
    let msg = "Не удалось войти. Попробуйте ещё раз.";
    try { msg = (await r.json()).error || msg; } catch (_) { /* не JSON */ }
    err.textContent = msg;
    document.getElementById("password").select();
  } catch (_) {
    err.textContent = "Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.";
  }
  go.disabled = false; go.textContent = "Войти";
});
</script>
